name: Build & Release PAIOS Android (.apk)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android Project
        run: |
          npx cap init "PAIOS Mobile" "com.paios.mobile" --web-dir=dist || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAIOS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
